[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-sentinel"
version = "0.1.0"
description = "MVP de deteccao inteligente de ocorrencias de seguranca em ambientes universitarios"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2,<3",
]

[project.optional-dependencies]
decision = [
  "python-dotenv>=1,<2",
  "typesafe-sdk>=0.7,<0.8",
]
perception = [
  "lap==0.5.13",
  "opencv-python==5.0.0.93",
  "supervision==0.30.4",
  "ultralytics==8.4.157",
]
dev = [
  "pytest>=9,<10",
  "ruff>=0.16,<0.17",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
